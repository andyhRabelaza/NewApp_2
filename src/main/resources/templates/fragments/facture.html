<!-- fragments/facture.html -->
<div th:fragment="content">
    <h2>Liste des factures</h2>

    <table border="1" cellpadding="10" cellspacing="0">
        <thead>
            <tr>
                <th>ID</th>
                <th>Fournisseur</th>
                <th>Montant total</th>
                <th>Statut</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="facture : ${factures}">
                <td th:text="${facture.name}">F001</td>
                <td th:text="${facture.supplier}">Nom Fournisseur</td>
                <td th:text="${#numbers.formatDecimal(facture.total, 1, 'POINT', 2, 'COMMA')} + ' €'">1,000.00 €</td>
                <td th:text="${facture.status}"
                    th:style="'color:' + (facture.status == 'Paid' ? 'green' : (facture.status == 'Unpaid' ? 'red' : 'orange'))">
                    En attente
                </td>
            </tr>
        </tbody>
    </table>
</div>
