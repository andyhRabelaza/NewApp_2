<div id="content" th:fragment="content">
    <h2>Liste des Commandes d'Achat</h2>

    <table border="1" cellspacing="0" cellpadding="8">
        <thead>
            <tr>
                <th>Nom de la commande</th>
                <th>Fournisseur</th>
                <th>Date de commande</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="commande : ${commandes}">
                <td th:text="${commande.name}">Nom</td>
                <td th:text="${commande.supplier}">Fournisseur</td>
                <td th:text="${commande.transaction_date}">Date</td>
                <td th:text="${commande.status}">Status</td>
            </tr>
        </tbody>
    </table>
</div>
