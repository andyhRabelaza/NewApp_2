<div th:fragment="content">
    <h3>Liste des demandes de devis</h3>

    <form onsubmit="return false;">
        <label for="fournisseurSelect">Sélectionnez un fournisseur :</label>
        <select id="fournisseurSelect">
            <option value="">Choisissez un fournisseur</option>
            <option th:each="fournisseur : ${fournisseurs}"
                    th:value="${fournisseur.name}"
                    th:text="${fournisseur.name}">
            </option>
        </select>
        <button id="loadButton" onclick="loadDemandeByFournisseur()">Charger les demandes</button>
    </form>

    <div id="demandeTable">
        <table id="demandeTableContent" border="1" cellpadding="8" cellspacing="0">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Client</th>
                    <th>Date</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="demandeTableBody">
            </tbody>
        </table>
    </div>
</div>
